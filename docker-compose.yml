name: padosipro_demo

services:
  db:
    image: postgres:16-alpine
    container_name: padosipro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: padosipro
    ports:
      # Exposed so you can also point the mobile app or psql at the same DB.
      - "5432:5432"
    volumes:
      - padosipro-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d padosipro"]
      interval: 5s
      timeout: 5s
      retries: 10



volumes:
  padosipro-db-data:
