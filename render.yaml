databases:
  - name: padosipro-db
    databaseName: padosipro
    user: padosipro_user

services:
  - type: web
    name: padosipro-api
    env: node
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    preDeployCommand: npm run db:push && npm run db:seed
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: padosipro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_LENGTH
        value: "6"
      - key: OTP_TTL_MINUTES
        value: "10"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "30"
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
